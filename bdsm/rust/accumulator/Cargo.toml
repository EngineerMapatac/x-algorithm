[package]
name = "abuse-score-accumulator"
version = "0.1.0"
edition = "2021"
description = "High-throughput Kafka→Redis user_id accumulator for abuse scoring pipeline"

[dependencies]
rdkafka = { version = "0.36", features = ["ssl", "sasl", "zstd"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1.5"
axum = "0.7"
dashmap = "6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
